server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for the Express backend
    # Using a variable forces Nginx to re-resolve DNS at runtime
    # instead of only at startup, which avoids failures when the
    # upstream container isn't registered yet.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream http://api:3001;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
